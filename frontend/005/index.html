<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>005 — Aurora Spatial</title><style>
*{box-sizing:border-box}body{margin:0;background:#070613;color:#eeedff;font-family:Arial,sans-serif;overflow-x:hidden}.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 33% 28%,#4a2b8b,transparent 35%),radial-gradient(ellipse at 72% 70%,#087b7866,transparent 34%)}.bg:after{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff5 1px,transparent 1px);background-size:45px 45px;mask-image:linear-gradient(#000,transparent)}.shell{position:relative;z-index:1;max-width:1450px;margin:auto;padding:24px 4vw 50px}.head{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{width:27px;height:27px;border-radius:50%;background:conic-gradient(#55f1d8,#a66cff,#55f1d8);box-shadow:0 0 28px #8e76ff}.head nav{display:flex;gap:28px;color:#8c88a6;font-size:11px}.head nav a:first-child{color:#fff}.head button{border:1px solid #ffffff2c;background:#ffffff0b;color:#eee;padding:10px 15px;border-radius:99px;cursor:pointer}.hero{min-height:380px;padding:8vh 0 3vh;display:grid;grid-template-columns:1fr .55fr;align-items:center}.hero h1{font-size:clamp(3.5rem,6.5vw,7.5rem);line-height:.85;letter-spacing:-.075em;margin:0}.hero h1 span{background:linear-gradient(90deg,#62eed7,#bd7dff);background-clip:text;color:transparent}.orb{width:245px;aspect-ratio:1;border-radius:50%;justify-self:center;position:relative;background:radial-gradient(circle at 35% 28%,#fff,#a46cff 9%,#211c4b 30%,#080716 68%);box-shadow:0 0 65px #824cff66,inset -25px -30px 50px #000;animation:float 5s ease-in-out infinite}.orb:before,.orb:after{content:"";position:absolute;inset:-22%;border:1px solid #7ef2dd66;border-radius:50%;transform:rotateX(68deg) rotateZ(-14deg)}.orb:after{inset:-40%;border-color:#aa6fff55;transform:rotateY(65deg) rotateZ(20deg)}.panels{display:grid;grid-template-columns:1.1fr .8fr .8fr;gap:12px}.card{min-height:210px;border:1px solid #ffffff20;background:#ffffff09;backdrop-filter:blur(24px);border-radius:20px;padding:20px}.card header{display:flex;justify-content:space-between;color:#8e89a8;font-size:9px;letter-spacing:.12em}.wave{display:flex;align-items:end;gap:5px;height:130px;padding-top:20px}.wave i{flex:1;height:var(--h);background:linear-gradient(#66f5d4,#6252ad33);border-radius:6px}.number{display:block;font-size:75px;letter-spacing:-.09em;margin-top:32px}.card p{font-size:10px;color:#8d89a6;line-height:1.6}.list{margin-top:23px;display:grid;gap:11px}.list div{display:flex;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid #ffffff18;font-size:10px}.toast{position:fixed;z-index:5;right:25px;bottom:25px;background:#e9e5ff;color:#231842;padding:12px 17px;border-radius:99px;opacity:0;transform:translateY(15px);transition:.25s}.toast.on{opacity:1;transform:none}@keyframes float{50%{transform:translateY(-12px) rotate(5deg)}}@media(max-width:760px){.head nav{display:none}.hero{grid-template-columns:1fr;min-height:480px}.hero h1{font-size:3.8rem}.orb{width:150px;margin-top:60px}.panels{grid-template-columns:1fr}}
</style></head><body><div class="bg"></div><div class="shell"><header class="head"><div class="brand"><i class="logo"></i>CodeGuardian</div><nav><a>Pulse</a><a>Reviews</a><a>Repositories</a><a>Knowledge</a></nav><button id="invite">Invite team +</button></header><section class="hero"><h1>See what your<br>code is <span>becoming.</span></h1><div class="orb"></div></section><section class="panels"><article class="card"><header><span>REVIEW VELOCITY</span><span>7 DAYS ↗</span></header><div class="wave"><i style="--h:35%"></i><i style="--h:48%"></i><i style="--h:42%"></i><i style="--h:68%"></i><i style="--h:54%"></i><i style="--h:88%"></i><i style="--h:72%"></i><i style="--h:94%"></i></div></article><article class="card"><header><span>CODE CONFIDENCE</span><span>+4.2%</span></header><strong class="number">94<small>%</small></strong><p>Confidence is rising across every active repository.</p></article><article class="card"><header><span>LIVE SIGNALS</span><span>12 TOTAL</span></header><div class="list"><div><span>Security</span><b>02</b></div><div><span>Reliability</span><b>04</b></div><div><span>Quality</span><b>06</b></div></div></article></section></div><div class="toast">邀请链接已复制</div><script>invite.onclick=()=>{document.querySelector('.toast').classList.add('on');setTimeout(()=>document.querySelector('.toast').classList.remove('on'),1800)}</script></body></html>
